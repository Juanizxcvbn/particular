const main = document.getElementById('main');
const filters = document.getElementById('filters');
const q = document.getElementById('q');

function esc(s){return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s, term){
  if(!term) return esc(s);
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc(s).replace(re, '<mark>$1</mark>');
}

let activeSheet = 'all';

filters.innerHTML = '<button data-id="all" class="active">todos</button>' +
  DATA.map(s=>`<button data-id="${s.id}">${s.title.replace(/^\S+\s/,'')}</button>`).join('');

filters.addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  activeSheet = e.target.dataset.id;
  [...filters.children].forEach(b=>b.classList.toggle('active', b===e.target));
  render();
});

function render(){
  const term = q.value.trim();
  // mientras hay texto en el buscador, ignoramos la pestaña de categoría
  // (si no, buscar "find" estando parado en "Windows" no mostraba nada)
  const sheets = term
    ? DATA
    : DATA.filter(s => activeSheet==='all' || s.id===activeSheet);
  let html = '';
  let any = false;

  sheets.forEach(sheet=>{
    const secs = sheet.sections.map(sec=>{
      const blocks = sec.blocks.filter(b=>{
        if(!term) return true;
        const haystack = (sec.h+' '+b.p+' '+b.code).toLowerCase();
        const words = term.toLowerCase().split(/\s+/).filter(Boolean);
        return words.every(w => haystack.includes(w));
      });
      if(!blocks.length) return '';
      return {sec, blocks};
    }).filter(Boolean);

    if(!secs.length) return;
    any = true;
    html += `<div class="sheet"><div class="sheet-title">${sheet.title}</div>`;
    secs.forEach(({sec, blocks})=>{
      const openCls = term ? ' open' : '';
      html += `<div class="sect${openCls}"><div class="sect-head" onclick="this.parentElement.classList.toggle('open')">
        <h3>${hl(sec.h, term)}</h3><span class="car">▶</span></div><div class="sect-body">`;
      blocks.forEach(b=>{
        html += `<div class="block"><p>${hl(b.p, term)}</p>
          <pre><button class="copy-btn" onclick="copyCode(this)">copy</button><code>${hl(b.code, term)}</code></pre></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  main.innerHTML = any ? html : '<p class="empty">sin resultados — probá otro término</p>';
}

function copyCode(btn){
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent = '✓'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='copy'; btn.classList.remove('done');}, 1200);
  });
}

q.addEventListener('input', ()=>{
  // feedback visual: mientras se busca, marcamos "todos" como activo
  // (la categoría real vuelve a aplicarse solo si se borra la búsqueda)
  const term = q.value.trim();
  [...filters.children].forEach(b=>b.classList.toggle('active', term ? b.dataset.id==='all' : b.dataset.id===activeSheet));
  render();
});
render();

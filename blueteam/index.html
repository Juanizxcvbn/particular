## Splunk (SPL)
Logons fallidos (4625) por usuario e IP|||index=wineventlog EventCode=4625 | stats count by Account_Name, src_ip | sort -count
Fuerza bruta con éxito posterior|||index=wineventlog (EventCode=4625 OR EventCode=4624) | stats count(eval(EventCode=4625)) as fail count(eval(EventCode=4624)) as ok by Account_Name, src_ip | where fail>10 AND ok>0
PowerShell encodido (Sysmon 1)|||index=sysmon EventCode=1 (CommandLine="*-enc*" OR CommandLine="*-EncodedCommand*") | table _time host User ParentImage Image CommandLine
Office lanzando cmd o PowerShell|||index=sysmon EventCode=1 (ParentImage="*winword.exe" OR ParentImage="*excel.exe") (Image="*cmd.exe" OR Image="*powershell.exe") | table _time host ParentImage Image CommandLine
Beaconing (conexiones periódicas)|||index=sysmon EventCode=3 | bin _time span=1m | stats count by _time, dest_ip | stats stdev(count) avg(count) dc(_time) by dest_ip | where dc(_time)>30 | sort stdev(count)
Usuario creado o agregado a grupo admin|||index=wineventlog (EventCode=4720 OR EventCode=4732) | table _time EventCode Account_Name Group_Name
Mayor tráfico saliente|||index=firewall action=allowed | stats sum(bytes_out) as out by src_ip, dest_ip | sort -out | head 20
Logs borrados (1102 / 104)|||index=wineventlog (EventCode=1102 OR EventCode=104) | table _time host Account_Name
Procesos raros (poco frecuentes)|||index=sysmon EventCode=1 | rare limit=20 Image
Acceso a LSASS (Sysmon 10)|||index=sysmon EventCode=10 TargetImage="*lsass.exe" | stats count by SourceImage, GrantedAccess

## Elastic (KQL / ES|QL)
KQL: logons fallidos|||event.code: 4625 and winlog.channel: "Security"
KQL: PowerShell sospechoso|||process.name: "powershell.exe" and process.command_line: (*-enc* or *-nop* or *bypass* or *downloadstring*)
KQL: Office lanza shell|||process.parent.name: ("winword.exe" or "excel.exe" or "outlook.exe") and process.name: ("cmd.exe" or "powershell.exe" or "wscript.exe")
KQL: conexiones a una IP|||event.category: network and destination.ip: "1.2.3.4"
KQL: acceso a LSASS|||event.code: 10 and winlog.event_data.TargetImage: *lsass.exe
KQL: servicio instalado (7045)|||event.code: 7045
KQL: buscar un hash|||file.hash.sha256: "HASH" or process.hash.sha256: "HASH"
ES|QL: fuerza bruta|||FROM logs-* | WHERE event.code == "4625" | STATS fails = COUNT(*) BY user.name, source.ip | WHERE fails > 10 | SORT fails DESC
ES|QL: procesos menos frecuentes|||FROM logs-* | WHERE event.category == "process" | STATS c = COUNT(*) BY process.name | SORT c ASC | LIMIT 20
Lucene: herramientas de credenciales|||process.command_line:*mimikatz* OR process.command_line:*sekurlsa*

## Sentinel (KQL)
Logons fallidos|||SecurityEvent | where EventID == 4625 | summarize Fails=count() by Account, IpAddress | where Fails > 10 | order by Fails desc
Fallidos y luego exitoso|||let fails = SecurityEvent | where EventID==4625 | summarize F=count() by IpAddress, Account | where F>10; SecurityEvent | where EventID==4624 | join kind=inner fails on IpAddress, Account | project TimeGenerated, Account, IpAddress, F
Sign-ins fallidos en Entra ID|||SigninLogs | where ResultType != 0 | summarize count() by UserPrincipalName, IPAddress, ResultDescription | order by count_ desc
Viaje imposible (varios países)|||SigninLogs | where ResultType==0 | extend Country=tostring(LocationDetails.countryOrRegion) | summarize Countries=make_set(Country), n=dcount(Country) by UserPrincipalName, bin(TimeGenerated,1h) | where n>1
PowerShell encodido (4688)|||SecurityEvent | where EventID==4688 | where CommandLine has_any ("-enc","-EncodedCommand","downloadstring") | project TimeGenerated, Computer, Account, CommandLine
Reglas de inbox sospechosas (O365)|||OfficeActivity | where Operation in ("New-InboxRule","Set-InboxRule") | project TimeGenerated, UserId, Parameters
Buscar IOC en firewall|||CommonSecurityLog | where DestinationIP in ("1.2.3.4","5.6.7.8") | project TimeGenerated, SourceIP, DestinationIP, DeviceAction
Grupos privilegiados modificados|||SecurityEvent | where EventID in (4728,4732,4756) | project TimeGenerated, Computer, SubjectAccount, MemberName, TargetAccount
En qué tablas aparece un término|||search "usuario" | summarize count() by $table

## QRadar (AQL)
Logons fallidos|||SELECT sourceip, username, COUNT(*) AS fails FROM events WHERE qidname(qid) ILIKE '%fail%' AND username IS NOT NULL GROUP BY sourceip, username HAVING fails > 10 LAST 24 HOURS
Eventos de una IP|||SELECT DATEFORMAT(starttime,'YYYY-MM-dd HH:mm:ss') AS t, sourceip, destinationip, qidname(qid) AS evento FROM events WHERE sourceip='1.2.3.4' LAST 1 HOURS
Top destinos por bytes (flows)|||SELECT destinationip, SUM(sourcebytes) AS bytes FROM flows GROUP BY destinationip ORDER BY bytes DESC LIMIT 20 LAST 1 HOURS
Ofensas abiertas por magnitud|||SELECT id, description, magnitude, offenseSource FROM offenses WHERE status='OPEN' ORDER BY magnitude DESC
Buscar texto en payload|||SELECT sourceip, UTF8(payload) FROM events WHERE UTF8(payload) ILIKE '%powershell%' LAST 6 HOURS
Eventos por log source|||SELECT LOGSOURCENAME(logsourceid) AS fuente, COUNT(*) AS c FROM events GROUP BY logsourceid ORDER BY c DESC LAST 1 HOURS
IPs contra un reference set de IOC|||SELECT sourceip FROM events WHERE REFERENCESETCONTAINS('IOC_IPs', sourceip) LAST 24 HOURS

Por puerto|||tcp.port == 4444
Exportar archivos|||Archivo > Exportar objetos > HTTP / SMB / FTP

const cats=[];
D.split("\n").forEach(l=>{l=l.trim();if(!l)return;
 if(l.startsWith("## "))cats.push({n:l.slice(3),i:[]});
 else{const p=l.split("|||");cats[cats.length-1].i.push([p[0],p[1]])}});
let act="Todo";
const nav=document.getElementById("nav"),out=document.getElementById("out"),q=document.getElementById("q"),n=document.getElementById("n");
["Todo",...cats.map(c=>c.n)].forEach(t=>{
 const b=document.createElement("button");b.textContent=t;
 b.onclick=()=>{act=t;render()};nav.appendChild(b)});
function render(){
 const s=q.value.toLowerCase().trim();let tot=0;out.textContent="";
 [...nav.children].forEach(b=>b.classList.toggle("on",b.textContent===act));
 cats.forEach(c=>{
  if(act!=="Todo"&&act!==c.n)return;
  const m=c.i.filter(x=>!s||(c.n+" "+x[0]+" "+x[1]).toLowerCase().includes(s));
  if(!m.length)return;
  const h=document.createElement("h2");h.textContent=c.n;out.appendChild(h);
  m.forEach(x=>{tot++;
   const d=document.createElement("div");d.className="it";
   const t=document.createElement("div");t.className="d";t.textContent=x[0];
   const r=document.createElement("div");r.className="r";
   const p=document.createElement("pre");
   if(/^https?:\/\//.test(x[1])){const a=document.createElement("a");a.href=x[1];a.target="_blank";a.rel="noopener noreferrer";a.textContent=x[1];p.appendChild(a)}else p.textContent=x[1];
   const b=document.createElement("button");b.className="cp";b.textContent="copiar";
   b.onclick=()=>{navigator.clipboard.writeText(x[1]).then(()=>{b.textContent="listo";b.classList.add("ok");setTimeout(()=>{b.textContent="copiar";b.classList.remove("ok")},1200)}).catch(()=>{b.textContent="error"})};
   r.append(p,b);d.append(t,r);out.appendChild(d)})});
 n.textContent=tot+" resultados"}
q.addEventListener("input",render);render();
</script>
